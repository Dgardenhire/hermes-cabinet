name: Platforms

# Proves Cabinet on real Windows, Linux and macOS machines: the test suite, a real Hermes installed
# the official way, the plugin installed from this commit the way a user installs it, Hermes's own
# validator, and Cabinet's backend adding and removing a Bot and a crew against that Hermes.
# Throwaway GitHub runners only. No secrets are used.

on:
  push:
    branches: [platforms]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare log folder and scratch Hermes home
        run: |
          mkdir -p ci-logs
          scratch="$RUNNER_TEMP/hermes-scratch"
          mkdir -p "$scratch"
          echo "SCRATCH_HOME=$scratch" >> "$GITHUB_ENV"
          echo "== $(uname -a)" | tee ci-logs/00-machine.log
          python --version | tee -a ci-logs/00-machine.log
          git --version | tee -a ci-logs/00-machine.log

      - name: 1. Test suite (stdlib Python, no Hermes)
        run: |
          cd tests
          python -m unittest discover -p "test_*.py" -v 2>&1 | tee ../ci-logs/01-tests.log

      - name: 2a. Install Hermes Agent (Linux / macOS one-liner)
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh \
            | bash -s -- --non-interactive --skip-browser --skip-computer-use 2>&1 | tee ci-logs/02-hermes-install.log
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 2b. Install Hermes Agent (Windows PowerShell one-liner)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $installer = Invoke-RestMethod https://hermes-agent.nousresearch.com/install.ps1
          & ([scriptblock]::Create($installer)) -NonInteractive -SkipBrowser -SkipComputerUse *>&1 | Tee-Object -FilePath ci-logs/02-hermes-install.log
          "$env:LOCALAPPDATA\hermes\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: 2c. Hermes answers
        if: ${{ !cancelled() }}
        run: |
          { which hermes; hermes --version; hermes plugins install --help; } 2>&1 | tee ci-logs/02c-hermes-version.log

      - name: 3a. Install the plugin from this commit, the way a user does
        if: ${{ !cancelled() }}
        env:
          HERMES_HOME: ${{ env.SCRATCH_HOME }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then src="file:///$(cygpath -m "$GITHUB_WORKSPACE")"; else src="file://$GITHUB_WORKSPACE"; fi
          echo "installing $src at $GITHUB_SHA into $HERMES_HOME"
          hermes plugins install "$src" --ref "$GITHUB_SHA" --enable --yes-deps < /dev/null 2>&1 | tee ci-logs/03a-plugin-install.log
          hermes plugins list 2>&1 | tee -a ci-logs/03a-plugin-install.log
          ls -la "$HERMES_HOME/plugins" | tee -a ci-logs/03a-plugin-install.log

      - name: 3b. Hermes validates the plugin
        if: ${{ !cancelled() }}
        env:
          HERMES_HOME: ${{ env.SCRATCH_HOME }}
        run: |
          set -o pipefail
          hermes plugins validate "$HERMES_HOME/plugins/bot-cabinet-v2" 2>&1 | tee ci-logs/03b-validate-installed.log
          hermes plugins validate "$GITHUB_WORKSPACE" 2>&1 | tee ci-logs/03b-validate-checkout.log

      - name: 3c. Cabinet's backend against this Hermes (plan, add, remove a Bot; set up and remove a crew)
        if: ${{ !cancelled() }}
        env:
          HERMES_HOME: ${{ env.SCRATCH_HOME }}
        run: |
          python .github/platforms/hermes_run.py .github/platforms/exercise_cabinet.py 2>&1 | tee ci-logs/03c-exercise.log

      - name: 4. Test suite again, with Hermes importable (runs the tests that call Hermes)
        if: ${{ !cancelled() }}
        run: |
          # The repo's rule (tests/run_with_hermes.py): Hermes code comes from a separate clone, never the installed copy.
          if [ "$RUNNER_OS" = Windows ]; then installed="$LOCALAPPDATA/hermes/hermes-agent"; else installed="$HOME/.hermes/hermes-agent"; fi
          git clone --quiet --no-hardlinks "$installed" "$RUNNER_TEMP/hermes-src"
          echo "installed Hermes $(git -C "$installed" rev-parse HEAD), clone $(git -C "$RUNNER_TEMP/hermes-src" rev-parse HEAD)" | tee ci-logs/04-tests-with-hermes.log
          CABINET_HERMES_SRC="$RUNNER_TEMP/hermes-src" python .github/platforms/hermes_run.py .github/platforms/run_suite.py 2>&1 | tee -a ci-logs/04-tests-with-hermes.log

      - name: Collect Hermes logs
        if: always()
        run: |
          for d in "$SCRATCH_HOME/logs" "$HOME/.hermes/logs" "${LOCALAPPDATA:-/nonexistent}/hermes/logs"; do
            if [ -d "$d" ]; then mkdir -p "ci-logs/hermes-logs/$(echo "$d" | tr ':/\\ ' '____')"; cp -R "$d"/. "ci-logs/hermes-logs/$(echo "$d" | tr ':/\\ ' '____')/" || true; fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.os }}
          path: ci-logs
          retention-days: 30
